<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CyberShield | Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
      :root {
        --bg: #0a0e17;
        --panel: rgba(17, 24, 39, 0.88);
        --cyan: #00d4ff;
        --text: #f5fbff;
        --muted: #93a9bb;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, rgba(0, 212, 255, 0.14), transparent 30%), var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .glass {
        background: var(--panel);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.28);
      }

      .btn-cyber {
        background: linear-gradient(90deg, var(--cyan), #0d7c91);
        color: white;
        border: none;
      }

      .btn-cyber:hover {
        color: white;
        filter: brightness(1.05);
      }

      .form-control {
        background: rgba(255, 255, 255, 0.04);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .form-control:focus {
        background: rgba(255, 255, 255, 0.06);
        color: white;
        border-color: var(--cyan);
        box-shadow: 0 0 0 0.2rem rgba(0, 212, 255, 0.25);
      }

      .hint {
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="glass rounded-4 p-4 p-md-5 w-100" style="max-width: 430px;">
      <div class="text-center mb-4">
        <i class="bi bi-shield-fill-check fs-1" style="color: var(--cyan);"></i>
        <h2 class="mt-3 mb-1 fw-bold">CyberShield</h2>
        <p class="text-muted mb-0">Admin Access Only</p>
      </div>

      {% if error %}
      <div class="alert alert-danger border-0 rounded-3 mb-3">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login" id="login-form">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input class="form-control" id="username" name="username" type="text" placeholder="admin" required />
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password" placeholder="••••••••" required />
        </div>
        <button class="btn btn-cyber w-100" type="submit" id="login-btn">
          <span class="me-2"><i class="bi bi-box-arrow-in-right"></i></span>
          Login
        </button>
      </form>

      <p class="hint mt-3 mb-0 text-center">Default credentials: admin / cybershield2025</p>
      <a href="/" class="d-block text-center mt-3 text-decoration-none" style="color: var(--cyan);">Back to CyberShield</a>
    </div>

    <script>
      const form = document.getElementById('login-form');
      const button = document.getElementById('login-btn');

      if (form && button) {
        form.addEventListener('submit', () => {
          button.disabled = true;
          button.innerHTML = '<span class="me-2"><i class="bi bi-arrow-repeat"></i></span>Signing in...';
        });
      }
    </script>
  </body>
</html>
